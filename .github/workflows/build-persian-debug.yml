name: Persian debug APK

on:
  push:
    branches:
      - persian-translation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: persian-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch FlexibleAdapter fallback repository
        uses: actions/checkout@v6
        with:
          repository: SyncYomi/SyncYomi
          ref: develop
          path: .syncyomi-fallback
          sparse-checkout: |
            e2e/gradle/m2
            e2e/gradle/fallback-repo.init.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        env:
          SYNCYOMI_M2_FALLBACK: ${{ github.workspace }}/.syncyomi-fallback/e2e/gradle/m2
        run: |
          chmod +x gradlew
          ./gradlew --init-script .syncyomi-fallback/e2e/gradle/fallback-repo.init.gradle.kts spotlessCheck assembleDebug --console=plain

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          find app/build/outputs/apk/debug -type f -name '*arm64-v8a*.apk' -print
          test -n "$(find app/build/outputs/apk/debug -type f -name '*arm64-v8a*.apk' -print -quit)"

      - name: Upload APK files
        uses: actions/upload-artifact@v7
        with:
          name: tadami-persian-debug-apk
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 7

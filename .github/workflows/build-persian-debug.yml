name: Persian debug APK

on:
  push:
    branches:
      - persian-translation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: persian-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          find app/build/outputs/apk/debug -type f -name '*.apk' -print
          test -n "$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"

      - name: Upload APK files
        uses: actions/upload-artifact@v7
        with:
          name: tadami-persian-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

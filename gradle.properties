android.nonTransitiveRClass=true
android.useAndroidX=true

kotlin.code.style=official

# Work around intermittent Gradle cache packaging corruption on Windows worktrees.
org.gradle.caching=true
org.gradle.configuration-cache=false
# Память важнее скорости тёплых сборок (владелец, 2026-09-22): демон само-останавливается
# через 15 с после последней команды — команды подряд остаются тёплыми, а после завершения
# работы память освобождается сама (Gradle-демон + Kotlin-демон суммарно держали ~10 ГБ).
org.gradle.daemon.idletimeout=15000
org.gradle.configureondemand=false
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
# Prefer the default Kotlin daemon for large release compiles; in-process was slower here.
# kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=true
kotlin.daemon.jvmargs=-Xmx6g

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
